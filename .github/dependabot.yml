version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Python upgrades are deliberate: requires-python, uv.lock and the Dockerfile move together.
      # Patch and digest (security) updates within 3.12 still come through.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: terraform
    directory: /infra/terraform/bootstrap
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/terraform/gcp
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/terraform/shared
    schedule:
      interval: weekly
