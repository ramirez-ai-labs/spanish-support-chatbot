name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Tests and CI never call Gemini or need a key.
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras # every cloud's adapters are type-checked and tested
      - name: Chat page scripts parse
        run: for f in ui/*.js; do node --check "$f"; done
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Import rules
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned Terraform version
        id: tf
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate every stack (no cloud access)
        run: |
          for dir in infra/terraform/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag spanish-support-chatbot:ci .
      - name: Image size budget (keeps cold starts fast and the registry inside its free 0.5 GB)
        run: |
          budget_mb=300 # uncompressed, 226 MB at M1; raised deliberately when e5 (#50) and Presidio (#51) land
          size_mb=$(( $(docker image inspect spanish-support-chatbot:ci --format '{{.Size}}') / 1000000 ))
          echo "Image size: ${size_mb} MB uncompressed (budget ${budget_mb} MB)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size_mb" -gt "$budget_mb" ]; then
            echo "::error::Image is ${size_mb} MB, over the ${budget_mb} MB budget."
            exit 1
          fi
      - name: Scan the image (HIGH and CRITICAL with a fix available fail the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: spanish-support-chatbot:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true # base-image CVEs with no fix yet can't be acted on; fixable ones fail
          exit-code: "1"
          hide-progress: true
      - name: Smoke test with the mock LLM
        run: |
          docker run -d --name api -p 8000:8000 -e LLM_PROVIDER=mock spanish-support-chatbot:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sfN localhost:8000/v1/chat -H 'Content-Type: application/json' \
            -d '{"message": "¿Cómo bloqueo mi tarjeta?"}' | tee reply.txt
          grep -q 'event: done' reply.txt
      - name: Container logs
        if: failure()
        run: docker logs api || echo "container never started; see the build step above"
