name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Tests and CI never call Gemini or need a key.
      LLM_PROVIDER: mock
      # Every `uv run` uses uv.lock as it is. Without this, each one rechecks the lock against
      # pyproject.toml, which fetches the spaCy model's metadata from its GitHub release and fails on
      # GitHub's 504s even after the offline sync below. The lock check step replaces that recheck.
      UV_FROZEN: "1"
    services:
      # Throwaway Postgres with Neon's pgvector, for the chunk store's contract tests.
      db:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          # No password: a throwaway container reachable only from this runner, with no data.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          # Keep downloaded wheels: pruning drops them, so the spaCy model (a GitHub release, often
          # 504ing) was fetched on every run. Python is cached too: uv downloads it from GitHub
          # releases as well, and the offline sync below needs it. The suffix starts a new key: an
          # existing entry is never saved over, and the old ones lack Python or were pruned.
          prune-cache: false
          cache-python: true
          cache-suffix: unpruned-python
      # Every cloud's adapters are type-checked and tested. Offline first: even with the wheel cached,
      # uv rechecks a URL dependency (the spaCy model, a GitHub release) with its server, so GitHub's
      # 504s failed this step with a full cache. Online only when the cache is missing something.
      - run: uv sync --frozen --all-extras --offline || uv sync --frozen --all-extras
        env:
          UV_HTTP_RETRIES: "8" # default 3; GitHub's release downloads time out under load
      # Offline when the lock is current, so no network is needed; online only to explain a mismatch.
      # The image also installs with --frozen, so a stale lock would otherwise ship unnoticed.
      - name: Lock file matches pyproject.toml
        run: uv lock --check --offline || uv lock --check
      - name: Chat page scripts parse
        run: for f in ui/*.js; do node --check "$f"; done
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Import rules
        run: uv run lint-imports
      - name: Fetch the pinned e5 model (checksummed), so its contract tests run
        run: uv run python -m adapters.shared.e5 fetch .models/e5
      - name: Tests
        run: uv run pytest
        env:
          E5_MODEL_DIR: .models/e5
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned Terraform version
        id: tf
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false
      # Providers download from GitHub releases, whose 504s kept failing this job. Cached by lock file,
      # so GitHub is only needed when a provider changes; init still checks each one against the
      # lock file's hashes. Saved as soon as init succeeds, even if a later step fails.
      - name: Restore cached Terraform providers
        id: tf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('infra/terraform/*/.terraform.lock.hcl') }}
      - name: Format
        run: terraform fmt -check -recursive infra/terraform
      - name: Init every stack (no backend), retrying GitHub's 504s
        id: init
        run: |
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for dir in infra/terraform/*/; do
            for attempt in 1 2 3 4; do
              terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly && break
              if [ "$attempt" = 4 ]; then exit 1; fi
              echo "init of $dir failed (attempt $attempt); retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            done
          done
      - name: Save the Terraform providers
        if: always() && steps.init.outcome == 'success' && steps.tf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('infra/terraform/*/.terraform.lock.hcl') }}
      - name: Validate every stack (no cloud access)
        run: for dir in infra/terraform/*/; do terraform -chdir="$dir" validate; done

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag spanish-support-chatbot:ci .
      - name: Image size budget (keeps cold starts fast and the registry inside its free 0.5 GB)
        run: |
          # Uncompressed: 226 MB at M1, 594 MB with e5 (#50), ~920 MB with Presidio and spaCy md (#51).
          # The registry's limit is on compressed layers: 340 MB for this image (#51).
          budget_mb=1000
          size_mb=$(( $(docker image inspect spanish-support-chatbot:ci --format '{{.Size}}') / 1000000 ))
          echo "Image size: ${size_mb} MB uncompressed (budget ${budget_mb} MB)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size_mb" -gt "$budget_mb" ]; then
            echo "::error::Image is ${size_mb} MB, over the ${budget_mb} MB budget."
            exit 1
          fi
      - name: Scan the image (HIGH and CRITICAL with a fix available fail the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: spanish-support-chatbot:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true # base-image CVEs with no fix yet can't be acted on; fixable ones fail
          exit-code: "1"
          hide-progress: true
      - name: The baked e5 model loads and ranks a Spanish passage correctly
        run: docker run --rm spanish-support-chatbot:ci python -m adapters.shared.e5 check /app/models/e5
      - name: Presidio and its Spanish model load offline and catch PII in a synthetic message
        run: docker run --rm --network none spanish-support-chatbot:ci python -m adapters.shared.presidio check
      - name: Smoke test with the mock LLM, and e5 retrieving from the docs indexed in memory
        run: |
          docker run -d --name api -p 8000:8000 -e LLM_PROVIDER=mock -e EMBEDDER=e5 -e PII_DETECTOR=presidio \
            -e KNOWLEDGE_STORE=memory -e RETRIEVAL_MIN_SCORE=0.82 spanish-support-chatbot:ci
          # Starts serving once the 84 chunks are embedded: seconds here, minutes on a slow laptop.
          for i in $(seq 1 180); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/v1/markets | grep -q '"code":"MX"'
          # Without a market: refused, since every answer comes from one market's policy.
          code=$(curl -s -o refused.txt -w '%{http_code}' localhost:8000/v1/chat \
            -H 'Content-Type: application/json' -d '{"message": "¿Cómo bloqueo mi tarjeta?"}')
          # `if` and not `&&`: under bash -e, a failure inside an && list doesn't stop the step.
          if [ "$code" != 400 ] || ! grep -q '"market_required"' refused.txt; then
            echo "::error::A message without a market was not refused with 400 market_required."
            exit 1
          fi
          # With a market: Mexico's own sources come first, then the answer.
          curl -sfN localhost:8000/v1/chat -H 'Content-Type: application/json' \
            -d '{"message": "¿Cómo bloqueo mi tarjeta?", "market": "MX"}' | tee rag.txt
          head -1 rag.txt | grep -q '^event: sources'
          if ! grep -q '"market": "MX"' rag.txt || grep -q '"market": "US"' rag.txt; then
            echo "::error::The MX answer's sources were not Mexico's own."
            exit 1
          fi
          grep -q 'event: done' rag.txt
          # Synthetic PII goes through the real Presidio in the image and the answer still completes.
          curl -sfN localhost:8000/v1/chat -H 'Content-Type: application/json' \
            -d '{"message": "Soy María Fernández, mi CURP es HEGG560427MVZRRL04 y mi correo maria.f@example.com. ¿Cómo bloqueo mi tarjeta?", "market": "MX"}' \
            | tee pii.txt
          grep -q 'event: done' pii.txt
      - name: Container logs
        if: failure()
        run: docker logs api || echo "container never started; see the build step above"
