name: terraform

# Plans the gcp stack on every PR (read-only account), proves the apply account is unreachable
# from PRs and from jobs outside the `prod` environment, and on main, after one approval, applies
# the stack and deploys the API image to Cloud Run. Bootstrap (infra/terraform/bootstrap) is never
# applied from CI.
#
# Actions logs are public on this repo. Project-specific values are Actions *secrets* (GitHub
# masks secrets everywhere; it never masks variables), the derived project number is masked
# explicitly, and job summaries carry only the plan counts.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "infra/terraform/gcp/**"
      - ".github/workflows/terraform.yml"
      - "core/**"
      - "adapters/**"
      - "apps/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false # never interrupt an apply

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
  STACK: infra/terraform/gcp
  REGION: us-east4 # matches var.region in the gcp stack
  SERVICE: chatbot-api

jobs:
  plan:
    name: tf-plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mask the project number (derived from a secret, so not masked automatically)
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          number="$(echo "$WIF_PROVIDER" | cut -d/ -f2)"
          if [ -n "$number" ]; then echo "::add-mask::$number"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tf
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false
      - name: Log in as the read-only plan account (keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PLAN_SA }}
      - name: The plan account must not read the shared stack's state (it holds provider-stored secrets)
        env:
          BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          if gcloud storage cat "gs://$BUCKET/shared/default.tfstate" >/dev/null 2>err.txt; then
            echo "::error::tf-plan can read the shared stack's state. The bootstrap condition is missing."
            exit 1
          fi
          echo "Refused as expected: $(grep -oE '\b(403|404)\b' err.txt | head -1 || echo error)"
      - name: Init
        run: terraform -chdir="$STACK" init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -lockfile=readonly
      - name: Plan (no state lock; the plan account cannot write state)
        run: |
          terraform -chdir="$STACK" plan -lock=false -no-color | tee plan.txt
          { echo "### gcp stack"; grep -E '^(Plan:|No changes)' plan.txt || echo "see job log"; } >> "$GITHUB_STEP_SUMMARY"

  apply-gate-pr:
    name: tf-apply-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Mask the project number (derived from a secret, so not masked automatically)
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          number="$(echo "$WIF_PROVIDER" | cut -d/ -f2)"
          if [ -n "$number" ]; then echo "::add-mask::$number"; fi
      - name: Try to act as the apply account from a PR (must be refused)
        id: attempt
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_APPLY_SA }}
          token_format: access_token
      - name: Fail if the PR got an apply token
        run: |
          if [ "${{ steps.attempt.outcome }}" = "success" ]; then
            echo "::error::A pull_request job obtained a tf-apply token. The trust gate is broken."
            exit 1
          fi
          echo "Refused as expected: pull requests cannot act as tf-apply."

  apply-gate-main:
    name: tf-apply-gate-main
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Mask the project number (derived from a secret, so not masked automatically)
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          number="$(echo "$WIF_PROVIDER" | cut -d/ -f2)"
          if [ -n "$number" ]; then echo "::add-mask::$number"; fi
      - name: Try to act as the apply account on main without the prod environment (must be refused)
        id: attempt
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_APPLY_SA }}
          token_format: access_token
      - name: Fail if a job outside prod got an apply token
        run: |
          if [ "${{ steps.attempt.outcome }}" = "success" ]; then
            echo "::error::A main job without the prod environment obtained a tf-apply token."
            exit 1
          fi
          echo "Refused as expected: only approved prod jobs can act as tf-apply."

  apply:
    name: tf-apply
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: apply-gate-main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod # requires the owner's approval; the GCP trust requires this environment
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mask the project number (derived from a secret, so not masked automatically)
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          number="$(echo "$WIF_PROVIDER" | cut -d/ -f2)"
          if [ -n "$number" ]; then echo "::add-mask::$number"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tf
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false
      - name: Log in as the apply account (keyless, prod only)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_APPLY_SA }}
      - name: Init
        run: terraform -chdir="$STACK" init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -lockfile=readonly
      - name: Plan
        run: terraform -chdir="$STACK" plan -no-color -out=tfplan | tee plan.txt
      - name: Apply
        run: |
          terraform -chdir="$STACK" apply -no-color tfplan
          { echo "### gcp stack applied"; grep -E '^(Plan:|No changes)' plan.txt || true; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build and push the API image (tagged with the commit)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          image="$REGION-docker.pkg.dev/$PROJECT_ID/app/api:$GITHUB_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Deploy to Cloud Run (settings come from Terraform; only the image changes)
        run: |
          # Mask the URL first: gcloud prints it, and anyone reading the logs could call the API.
          url="$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')"
          echo "::add-mask::$url"
          echo "URL=$url" >> "$GITHUB_ENV"
          gcloud run services update "$SERVICE" --region "$REGION" --image "$IMAGE" --quiet
          echo "Deployed commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test the deployed API
        run: |
          url="$URL"
          if ! curl -sf --retry 5 --retry-all-errors --max-time 10 "$url/health" | grep -q '"ok"'; then
            echo "::error::/health did not return ok: the container did not start or is not serving."
            exit 1
          fi
          # A forged token must be refused by the app (not by Cloud Run) before anything streams.
          forged="eyJhbGciOiJSUzI1NiIsImtpZCI6InNtb2tlIn0.eyJzdWIiOiJzbW9rZSJ9.c21va2U"
          refused="$(curl -s --max-time 10 -w ' %{http_code}' -H "Authorization: Bearer $forged" \
            -H 'Content-Type: application/json' -d '{"message": "hola"}' "$url/v1/chat")"
          if [ "$refused" != '{"error":"invalid_token"} 401' ]; then
            echo "::error::A forged token was not refused with 401 invalid_token: the token check is not live."
            exit 1
          fi
          # One real question through Gemini: the stream must carry text and end with "done".
          reply="$(curl -sN --max-time 90 -H 'Content-Type: application/json' \
            -d '{"message": "¿Cómo bloqueo mi tarjeta?"}' "$url/v1/chat")"
          if grep -q '^event: error' <<<"$reply"; then
            echo "::error::Chat returned model_unavailable: the Gemini call failed. The llm_error line in the Cloud Run logs has the error type and status code (401 = bad key)."
            exit 1
          fi
          if ! grep -q '^data: {"delta"' <<<"$reply" || ! grep -q '^event: done' <<<"$reply"; then
            echo "::error::Chat stream was incomplete: no text, or no final done event (timeout or cut connection)."
            exit 1
          fi
          echo "Smoke test passed: /health ok, forged token refused, and a streamed Spanish answer" >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: tf-scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan Terraform for misconfigurations (HIGH and CRITICAL fail the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
