name: terraform

# Plans the gcp stack on every PR (read-only account), proves the apply account is unreachable
# from PRs and from jobs outside the `prod` environment, and applies on main after approval.
# Bootstrap (infra/terraform/bootstrap) is never applied from CI.
#
# Actions logs are public on this repo: every project-specific value is masked before anything
# runs, and job summaries carry only the plan counts.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "infra/terraform/gcp/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false # never interrupt an apply

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  STACK: infra/terraform/gcp

jobs:
  plan:
    name: tf-plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mask project values
        run: |
          for v in "${{ vars.GCP_PROJECT_ID }}" "${{ vars.TF_STATE_BUCKET }}" "${{ vars.GCP_PLAN_SA }}" \
                   "${{ vars.GCP_APPLY_SA }}" "${{ vars.GCP_WIF_PROVIDER }}"; do
            [ -n "$v" ] && echo "::add-mask::$v"
          done
          number="$(echo '${{ vars.GCP_WIF_PROVIDER }}' | cut -d/ -f2)"
          [ -n "$number" ] && echo "::add-mask::$number"
          true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tf
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false
      - name: Log in as the read-only plan account (keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}
      - name: Init
        run: terraform -chdir="$STACK" init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -lockfile=readonly
      - name: Plan (no state lock; the plan account cannot write state)
        run: |
          terraform -chdir="$STACK" plan -lock=false -no-color | tee plan.txt
          { echo "### gcp stack"; grep -E '^(Plan:|No changes)' plan.txt || echo "see job log"; } >> "$GITHUB_STEP_SUMMARY"

  apply-gate-pr:
    name: tf-apply-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Mask project values
        run: |
          for v in "${{ vars.GCP_PROJECT_ID }}" "${{ vars.TF_STATE_BUCKET }}" "${{ vars.GCP_PLAN_SA }}" \
                   "${{ vars.GCP_APPLY_SA }}" "${{ vars.GCP_WIF_PROVIDER }}"; do
            [ -n "$v" ] && echo "::add-mask::$v"
          done
          number="$(echo '${{ vars.GCP_WIF_PROVIDER }}' | cut -d/ -f2)"
          [ -n "$number" ] && echo "::add-mask::$number"
          true
      - name: Try to act as the apply account from a PR (must be refused)
        id: attempt
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SA }}
          token_format: access_token
      - name: Fail if the PR got an apply token
        run: |
          if [ "${{ steps.attempt.outcome }}" = "success" ]; then
            echo "::error::A pull_request job obtained a tf-apply token. The trust gate is broken."
            exit 1
          fi
          echo "Refused as expected: pull requests cannot act as tf-apply."

  apply-gate-main:
    name: tf-apply-gate-main
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Mask project values
        run: |
          for v in "${{ vars.GCP_PROJECT_ID }}" "${{ vars.TF_STATE_BUCKET }}" "${{ vars.GCP_PLAN_SA }}" \
                   "${{ vars.GCP_APPLY_SA }}" "${{ vars.GCP_WIF_PROVIDER }}"; do
            [ -n "$v" ] && echo "::add-mask::$v"
          done
          number="$(echo '${{ vars.GCP_WIF_PROVIDER }}' | cut -d/ -f2)"
          [ -n "$number" ] && echo "::add-mask::$number"
          true
      - name: Try to act as the apply account on main without the prod environment (must be refused)
        id: attempt
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SA }}
          token_format: access_token
      - name: Fail if a job outside prod got an apply token
        run: |
          if [ "${{ steps.attempt.outcome }}" = "success" ]; then
            echo "::error::A main job without the prod environment obtained a tf-apply token."
            exit 1
          fi
          echo "Refused as expected: only approved prod jobs can act as tf-apply."

  apply:
    name: tf-apply
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: apply-gate-main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod # requires the owner's approval; the GCP trust requires this environment
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mask project values
        run: |
          for v in "${{ vars.GCP_PROJECT_ID }}" "${{ vars.TF_STATE_BUCKET }}" "${{ vars.GCP_PLAN_SA }}" \
                   "${{ vars.GCP_APPLY_SA }}" "${{ vars.GCP_WIF_PROVIDER }}"; do
            [ -n "$v" ] && echo "::add-mask::$v"
          done
          number="$(echo '${{ vars.GCP_WIF_PROVIDER }}' | cut -d/ -f2)"
          [ -n "$number" ] && echo "::add-mask::$number"
          true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tf
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false
      - name: Log in as the apply account (keyless, prod only)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SA }}
      - name: Init
        run: terraform -chdir="$STACK" init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -lockfile=readonly
      - name: Plan
        run: terraform -chdir="$STACK" plan -no-color -out=tfplan | tee plan.txt
      - name: Apply
        run: |
          terraform -chdir="$STACK" apply -no-color tfplan
          { echo "### gcp stack applied"; grep -E '^(Plan:|No changes)' plan.txt || true; } >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: tf-scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan Terraform for misconfigurations (HIGH and CRITICAL fail the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
