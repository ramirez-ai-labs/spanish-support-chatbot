name: terraform

# Plans the gcp stack on every PR (read-only account), proves the apply account is unreachable
# from PRs and from jobs outside the `prod` environment, and on main, after one approval, applies
# the shared and gcp stacks and deploys the API image to Cloud Run. The shared stack (Cloudflare) is
# only planned inside that approved job: its token is a `prod` environment secret, and its state is
# unreadable by tf-plan. Bootstrap (infra/terraform/bootstrap) is never applied from CI.
#
# Actions logs are public on this repo. Project-specific values are Actions *secrets* (GitHub
# masks secrets everywhere; it never masks variables), the derived project number is masked
# explicitly, and job summaries carry only the plan counts.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "infra/terraform/gcp/**"
      - "infra/terraform/shared/**"
      - ".github/workflows/terraform.yml"
      - "ui/**"
      - "core/**"
      - "adapters/**"
      - "apps/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false # never interrupt an apply

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
  STACK: infra/terraform/gcp
  REGION: us-east4 # matches var.region in the gcp stack
  SERVICE: chatbot-api

jobs:
  plan:
    name: tf-plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mask the project number (derived from a secret, so not masked automatically)
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          number="$(echo "$WIF_PROVIDER" | cut -d/ -f2)"
          if [ -n "$number" ]; then echo "::add-mask::$number"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tf
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false
      # Read-only: restores the providers that ci.yml caches on main (same key). Main's jobs only see
      # main's caches, and init still checks each provider against the lock file.
      - name: Restore cached Terraform providers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('infra/terraform/*/.terraform.lock.hcl') }}
      - run: echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
      - name: Log in as the read-only plan account (keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PLAN_SA }}
      - name: The plan account must not read the shared stack's state (it holds provider-stored secrets)
        env:
          BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          if gcloud storage cat "gs://$BUCKET/shared/default.tfstate" >/dev/null 2>err.txt; then
            echo "::error::tf-plan can read the shared stack's state. The bootstrap condition is missing."
            exit 1
          fi
          # "matched no objects" until the shared stack has state, then 403. Anything else (e.g. an
          # auth error) fails, so a broken login can't pass as a refusal.
          if ! grep -qE '\b(403|404)\b|matched no objects|[Ff]orbidden|does not have' err.txt; then
            echo "::error::Unexpected error reading the shared state:"; head -1 err.txt; exit 1
          fi
          echo "Refused as expected: $(head -1 err.txt)"
      - name: Init
        run: bash infra/scripts/tf-init.sh "$STACK" -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
      - name: Plan (no state lock; the plan account cannot write state)
        run: |
          terraform -chdir="$STACK" plan -lock=false -no-color | tee plan.txt
          { echo "### gcp stack"; grep -E '^(Plan:|No changes)' plan.txt || echo "see job log"; } >> "$GITHUB_STEP_SUMMARY"

  apply-gate-pr:
    name: tf-apply-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Mask the project number (derived from a secret, so not masked automatically)
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          number="$(echo "$WIF_PROVIDER" | cut -d/ -f2)"
          if [ -n "$number" ]; then echo "::add-mask::$number"; fi
      - name: Try to act as the apply account from a PR (must be refused)
        id: attempt
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_APPLY_SA }}
          token_format: access_token
      - name: Fail if the PR got an apply token
        run: |
          if [ "${{ steps.attempt.outcome }}" = "success" ]; then
            echo "::error::A pull_request job obtained a tf-apply token. The trust gate is broken."
            exit 1
          fi
          echo "Refused as expected: pull requests cannot act as tf-apply."

  apply-gate-main:
    name: tf-apply-gate-main
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Mask the project number (derived from a secret, so not masked automatically)
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          number="$(echo "$WIF_PROVIDER" | cut -d/ -f2)"
          if [ -n "$number" ]; then echo "::add-mask::$number"; fi
      - name: Try to act as the apply account on main without the prod environment (must be refused)
        id: attempt
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_APPLY_SA }}
          token_format: access_token
      - name: Fail if a job outside prod got an apply token
        run: |
          if [ "${{ steps.attempt.outcome }}" = "success" ]; then
            echo "::error::A main job without the prod environment obtained a tf-apply token."
            exit 1
          fi
          echo "Refused as expected: only approved prod jobs can act as tf-apply."

  apply:
    name: tf-apply
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: apply-gate-main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod # requires the owner's approval; the GCP trust requires this environment
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mask the project number (derived from a secret, so not masked automatically)
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          number="$(echo "$WIF_PROVIDER" | cut -d/ -f2)"
          if [ -n "$number" ]; then echo "::add-mask::$number"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tf
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false
      # Read-only: restores the providers that ci.yml caches on main (same key). Main's jobs only see
      # main's caches, and init still checks each provider against the lock file.
      - name: Restore cached Terraform providers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('infra/terraform/*/.terraform.lock.hcl') }}
      - run: echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
      - name: Log in as the apply account (keyless, prod only)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_APPLY_SA }}
      - name: Shared stack (Cloudflare Pages and Turnstile)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          shared=infra/terraform/shared
          bash infra/scripts/tf-init.sh "$shared" -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          terraform -chdir="$shared" plan -no-color -out=tfplan | tee shared-plan.txt
          terraform -chdir="$shared" apply -no-color tfplan
          { echo "### shared stack applied"; grep -E '^(Plan:|No changes)' shared-plan.txt || true; } >> "$GITHUB_STEP_SUMMARY"
      - name: Init
        run: bash infra/scripts/tf-init.sh "$STACK" -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
      - name: Plan
        run: terraform -chdir="$STACK" plan -no-color -out=tfplan | tee plan.txt
      - name: Apply
        run: |
          terraform -chdir="$STACK" apply -no-color tfplan
          { echo "### gcp stack applied"; grep -E '^(Plan:|No changes)' plan.txt || true; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build and push the API image (tagged with the commit)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          image="$REGION-docker.pkg.dev/$PROJECT_ID/app/api:$GITHUB_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Deploy to Cloud Run (settings come from Terraform; only the image changes)
        run: |
          # Mask the URL first: gcloud prints it, and anyone reading the logs could call the API.
          url="$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')"
          echo "::add-mask::$url"
          echo "URL=$url" >> "$GITHUB_ENV"
          # The image live before this deploy is the rollback target, so the prune step keeps it.
          previous="$(gcloud run services describe "$SERVICE" --region "$REGION" \
            --format 'value(spec.template.spec.containers[0].image)')"
          echo "PREVIOUS_IMAGE=$previous" >> "$GITHUB_ENV"
          gcloud run services update "$SERVICE" --region "$REGION" --image "$IMAGE" --quiet
          echo "Deployed commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Mint the deploy job's signed identity for the smoke test (tf-apply, fixed audience)
        id: probe
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_APPLY_SA }}
          token_format: id_token
          id_token_audience: spanish-support-chatbot-deploy-probe # = PROBE_AUDIENCE in adapters/gcp/deploy_probe.py
          id_token_include_email: true
          create_credentials_file: false
      - name: Smoke test the deployed API
        env:
          PROBE: ${{ steps.probe.outputs.id_token }}
        run: |
          echo "::add-mask::$PROBE"
          url="$URL"
          if ! curl -sf --retry 5 --retry-all-errors --max-time 10 "$url/health" | grep -q '"ok"'; then
            echo "::error::/health did not return ok: the container did not start or is not serving."
            exit 1
          fi
          # A forged token must be refused by the app (not by Cloud Run) before anything streams.
          forged="eyJhbGciOiJSUzI1NiIsImtpZCI6InNtb2tlIn0.eyJzdWIiOiJzbW9rZSJ9.c21va2U"
          refused="$(curl -s --max-time 10 -w ' %{http_code}' -H "Authorization: Bearer $forged" \
            -H 'Content-Type: application/json' -d '{"message": "hola"}' "$url/v1/chat")"
          if [ "$refused" != '{"error":"invalid_token"} 401' ]; then
            echo "::error::A forged token was not refused with 401 invalid_token: the token check is not live."
            exit 1
          fi
          # Without a Turnstile token (and not the probe), a message must be refused.
          botcheck="$(curl -s --max-time 10 -w ' %{http_code}' -H 'Content-Type: application/json' \
            -d '{"message": "hola"}' "$url/v1/chat")"
          if [ "$botcheck" != '{"error":"turnstile_required"} 403' ]; then
            echo "::error::A message without a Turnstile token was not refused with 403: the bot check is not live."
            exit 1
          fi
          # The same for sign-in links: no Turnstile token, no email (the address is synthetic).
          signin="$(curl -s --max-time 10 -w ' %{http_code}' -H 'Content-Type: application/json' \
            -d '{"email": "smoke@example.com"}' "$url/v1/sign-in-link")"
          if [ "$signin" != '{"error":"turnstile_required"} 403' ]; then
            echo "::error::A sign-in link request without a Turnstile token was not refused with 403."
            exit 1
          fi
          # An unknown market is refused before anything streams.
          market="$(curl -s --max-time 10 -w ' %{http_code}' -H 'Content-Type: application/json' \
            -H "X-Deploy-Probe: $PROBE" -d '{"message": "hola", "market": "XX"}' "$url/v1/chat")"
          if [ "$market" != '{"error":"unknown_market"} 400' ]; then
            echo "::error::An unknown market was not refused with 400 unknown_market."
            exit 1
          fi
          # So is a message with no market at all: every answer comes from one market's policy.
          nomarket="$(curl -s --max-time 10 -w ' %{http_code}' -H 'Content-Type: application/json' \
            -H "X-Deploy-Probe: $PROBE" -d '{"message": "hola"}' "$url/v1/chat")"
          if [ "$nomarket" != '{"error":"market_required"} 400' ]; then
            echo "::error::A message without a market was not refused with 400 market_required."
            exit 1
          fi
          # The same real question as a US and a Mexican customer, as the deploy probe (which skips
          # the bot check): each stream starts with sources from its own market (or all) only,
          # carries text and ends with "done". The M2 demo, checked on every deploy. The check below
          # is Python in single quotes: no apostrophes in it, or the shell ends the string early.
          for m in US MX; do
            reply="$(curl -sN --max-time 90 -H 'Content-Type: application/json' -H "X-Deploy-Probe: $PROBE" \
              -d "{\"message\": \"¿Qué documentos necesito para abrir una cuenta?\", \"market\": \"$m\"}" "$url/v1/chat")"
            if grep -q '"error": "knowledge_unavailable"' <<<"$reply"; then
              echo "::error::Chat returned knowledge_unavailable for $m: retrieval failed. The knowledge_error line in the Cloud Run logs has the error type."
              exit 1
            fi
            if grep -q '^event: error' <<<"$reply"; then
              echo "::error::Chat returned model_unavailable for $m: the Gemini call failed. The llm_error line in the Cloud Run logs has the error type and status code (401 = bad key)."
              exit 1
            fi
            if ! grep -q '^data: {"delta"' <<<"$reply" || ! grep -q '^event: done' <<<"$reply"; then
              echo "::error::Chat stream for $m was incomplete: no text, or no final done event (timeout or cut connection)."
              exit 1
            fi
            if ! python3 -c '
          import json, sys
          market, body = sys.argv[1], sys.stdin.read()
          first = body.split("\n\n")[0].splitlines()
          assert first[0] == "event: sources", "no sources event first"
          sources = json.loads(first[1].removeprefix("data: "))["sources"]
          assert sources, "no sources"
          assert {s["market"] for s in sources} <= {market, "all"}, "a source from another market"
          assert market in {s["market"] for s in sources}, "no source from the market itself"' "$m" <<<"$reply"; then
              echo "::error::Chat for $m didn't start with sources from $m's own policy docs."
              exit 1
            fi
          done
          echo "Smoke test passed: /health ok, forged token, missing bot checks (chat, sign-in link) and an unknown market refused, and the same question as US and MX answered with each market's own sources" >> "$GITHUB_STEP_SUMMARY"
      - name: Prune old API images (keep the live one and the rollback; the registry is free to 0.5 GB)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          # Runs only after the smoke test passes, so a broken deploy never deletes its rollback.
          repo="$REGION-docker.pkg.dev/$PROJECT_ID/app/api"
          keep="$(gcloud artifacts docker images describe "$IMAGE" --format 'value(image_summary.digest)')"
          if [ -n "$PREVIOUS_IMAGE" ]; then
            keep="$keep $(gcloud artifacts docker images describe "$PREVIOUS_IMAGE" \
              --format 'value(image_summary.digest)' 2>/dev/null || true)"
          fi
          [ -n "${keep// /}" ] || { echo "::error::Couldn't resolve the live image's digest; nothing pruned."; exit 1; }
          # A push can be an image index (newer runners' Docker adds an attestation manifest), whose
          # children are listed as images of their own and can't be deleted while it exists. So a kept
          # index keeps its children, and indexes go before the manifests they point to.
          token="$(gcloud auth print-access-token)"
          for digest in $keep; do
            keep="$keep $(curl -fsS -u "oauth2accesstoken:$token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://$REGION-docker.pkg.dev/v2/$PROJECT_ID/app/api/manifests/$digest" \
              | jq -r '.manifests[]?.digest' | tr '\n' ' ')"
          done
          deleted=0
          for pass in indexes manifests; do
            if [ "$pass" = indexes ]; then filter='select(.metadata.mediaType | test("index|list"))'
            else filter='select(.metadata.mediaType | test("index|list") | not)'; fi
            for digest in $(gcloud artifacts docker images list "$repo" --format json | jq -r ".[] | $filter | .version"); do
              case " $keep " in *" $digest "*) continue ;; esac
              gcloud artifacts docker images delete "$repo@$digest" --delete-tags --quiet
              deleted=$((deleted + 1))
            done
          done
          # A warning, not a failure: the deploy already succeeded, and the reported size lags a
          # delete until unreferenced layers are cleaned up (about a day). Two days in a row over
          # the limit mean the image itself is too big.
          # From the API: `gcloud artifacts repositories describe` only prints the size to stderr, as
          # text, and --format 'value(sizeBytes)' comes back empty.
          size_bytes="$(curl -fsS -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            "https://artifactregistry.googleapis.com/v1/projects/$PROJECT_ID/locations/$REGION/repositories/app" \
            | jq -r '.sizeBytes // empty' || true)"
          if [[ "$size_bytes" =~ ^[0-9]+$ ]]; then
            size_mb=$(( size_bytes / 1000000 ))
            echo "Registry: pruned $deleted old images, $size_mb MB stored (free to 500 MB)" >> "$GITHUB_STEP_SUMMARY"
            if [ "$size_mb" -gt 450 ]; then
              echo "::warning::The registry stores $size_mb MB, close to or over the 500 MB free tier."
            fi
          else
            echo "Registry: pruned $deleted old images (size not reported)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy the chat page to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The uploaded copy gets the deployed API's URL, the widget's public site key and the
          # restricted sign-in browser key (public in the page; masked here to keep logs clean).
          site_key="$(terraform -chdir=infra/terraform/shared output -raw turnstile_site_key)"
          sign_in_key="$(terraform -chdir="$STACK" output -raw sign_in_api_key)"
          echo "::add-mask::$sign_in_key"
          rm -rf ui-dist && cp -r ui ui-dist
          printf 'window.CHAT_CONFIG = { apiUrl: "%s", turnstileSiteKey: "%s", signInApiKey: "%s" };\n' \
            "$URL" "$site_key" "$sign_in_key" > ui-dist/config.js
          sed -i "s#__API_ORIGIN__#$URL#" ui-dist/_headers
          npx --yes wrangler@4.156.0 pages deploy ui-dist --project-name spanish-support-chatbot \
            --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
      - name: Smoke test the chat page
        run: |
          page="https://spanish-support-chatbot.pages.dev"
          # The edge can take a few seconds to serve a new deployment.
          for i in $(seq 1 12); do
            if curl -sf --max-time 10 "$page/config.js" | grep -qF "$URL"; then break; fi
            [ "$i" = 12 ] && { echo "::error::The page doesn't serve this deploy's config.js."; exit 1; }
            sleep 5
          done
          headers="$(curl -sI --max-time 10 "$page/")"
          if ! grep -qi "^content-security-policy: .*connect-src $URL" <<<"$headers"; then
            echo "::error::The page is missing its Content-Security-Policy."; exit 1
          fi
          # The page's key must not send sign-in emails itself; only the API does, behind
          # Turnstile. The body is empty, so even a key without the restriction would send nothing.
          key="$(curl -sf --max-time 10 "$page/config.js" | sed -n 's/.*signInApiKey: "\([^"]*\)".*/\1/p')"
          echo "::add-mask::$key"
          for i in $(seq 1 6); do # a changed restriction can take a minute to apply
            direct="$(curl -s --max-time 10 -H "Referer: $page/" -H 'Content-Type: application/json' \
              -d '{}' "https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=$key")"
            if grep -q API_KEY_SERVICE_BLOCKED <<<"$direct"; then break; fi
            [ "$i" = 6 ] && { echo "::error::The page's browser key can still send sign-in emails directly."; exit 1; }
            sleep 10
          done
          echo "Chat page deployed: $page (config, security headers and browser-key limits checked)" >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: tf-scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan Terraform for misconfigurations (HIGH and CRITICAL fail the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
