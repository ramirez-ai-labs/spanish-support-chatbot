# Local stack.
#   docker compose up --build                       -> real Gemini (needs GEMINI_API_KEY in .env)
#   LLM_PROVIDER=mock docker compose up --build     -> mock LLM, no key, no network
#   docker compose up -d db                         -> Postgres with pgvector, for the knowledge
#     tests: TEST_DATABASE_URL=postgresql://postgres@localhost:5433/postgres uv run pytest

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      TRACE_EXPORTER: ${TRACE_EXPORTER:-none}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080} # the chat page served locally from ui/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Throwaway local Postgres with the same pgvector as Neon (0.8.0), for the chunk store's
  # contract tests and local indexing. No volume: it starts empty every time. No password either,
  # so it's published on this machine's loopback only.
  db:
    image: pgvector/pgvector:0.8.0-pg17
    profiles: ["db"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
