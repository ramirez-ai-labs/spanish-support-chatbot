[project]
name = "spanish-support-chatbot"
version = "0.0.1"
description = "Spanish-language support assistant for a fictional bank"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "google-genai>=2.34",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "httpx2>=2.16",
    "ruff>=0.17",
    "mypy>=2.4",
    "import-linter>=2.15",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["core", "adapters", "apps"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.importlinter]
root_packages = ["core", "adapters", "apps"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is cloud-free: no SDKs, web framework, adapters or apps"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "adapters",
    "apps",
    "google",
    "boto3",
    "botocore",
    "azure",
    "fastapi",
    "starlette",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "layers: apps -> adapters -> core"
type = "layers"
layers = ["apps", "adapters", "core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
