[project]
name = "spanish-support-chatbot"
version = "0.0.1"
description = "Spanish-language support assistant for a fictional bank"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "google-genai>=2.34",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pyjwt[crypto]>=2.15.1",
    "psycopg[binary]>=3.3.6",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "onnxruntime>=1.23 ; platform_machine == 'arm64' or sys_platform != 'darwin'",
    "tokenizers>=0.21",
    "numpy>=2.2",
    "presidio-analyzer>=2.2.366",
    "es-core-news-md",
]

[project.optional-dependencies]
gcp = [
    "opentelemetry-exporter-gcp-trace>=1.15.0",
    "google-auth[requests]>=2.62", # the runtime account's token for Identity Platform (#72)
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "httpx2>=2.16",
    "ruff>=0.17",
    "mypy>=2.4",
    "import-linter>=2.15",
    "types-pyyaml>=6.0.12",
]

[tool.uv]
package = false

[tool.uv.sources]
es-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["core", "adapters", "apps"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# onnxruntime ships no type hints, and has no wheel for Intel Macs on macOS 12 (see e5.py).
[[tool.mypy.overrides]]
module = ["onnxruntime"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["core", "adapters", "apps"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is cloud-free: no SDKs, web framework, adapters or apps"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "adapters",
    "apps",
    "google",
    "boto3",
    "botocore",
    "azure",
    "fastapi",
    "starlette",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "layers: apps -> adapters -> core"
type = "layers"
layers = ["apps", "adapters", "core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Integration tests call real services (e.g. Gemini). CI and the default run skip them; run them
# locally with `uv run pytest -m integration`.
addopts = "-m 'not integration' --strict-markers"
markers = ["integration: calls a real external service; needs credentials in .env"]
