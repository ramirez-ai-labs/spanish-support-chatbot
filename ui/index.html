<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asistente de soporte</title>
    <meta name="description" content="Asistente de soporte en español de un banco ficticio (demo con datos sintéticos)." />
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Asistente de soporte</h1>
        <p class="note">Banco ficticio · demo con datos sintéticos. No escribas datos reales.</p>
      </header>

      <section id="account" aria-label="Cuenta" hidden>
        <form id="sign-in" autocomplete="on">
          <label for="email">Inicia sesión con un enlace por correo (opcional)</label>
          <div class="row">
            <input id="email" type="email" required placeholder="tu@correo.com" autocomplete="email" />
            <button type="submit" id="send-link">Enviar enlace</button>
          </div>
        </form>
        <p id="signed-in" hidden>
          Sesión iniciada como <strong id="who"></strong> ·
          <button type="button" id="sign-out" class="link">Cerrar sesión</button>
        </p>
        <p id="account-status" class="note" role="status"></p>
      </section>

      <section id="log" aria-live="polite" aria-label="Conversación"></section>

      <form id="chat" autocomplete="off">
        <div class="market">
          <label for="market">¿Desde qué país nos escribes?</label>
          <select id="market" name="market" required disabled>
            <option value="" selected disabled>Cargando países…</option>
          </select>
        </div>
        <label for="message" class="visually-hidden">Tu pregunta</label>
        <textarea id="message" name="message" rows="2" maxlength="2000" required
          placeholder="Escribe tu pregunta, por ejemplo: ¿Cómo bloqueo mi tarjeta?"></textarea>
        <div class="row">
          <div id="turnstile"></div>
          <button type="submit" id="send">Enviar</button>
        </div>
        <p id="status" class="note" role="status"></p>
      </form>
    </main>
  </body>
</html>
